name: Lighthouse CI

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          lhci_config_path: .lighthouserc.json
          urls: ${{ secrets.SITE_URL }}
          upload: temporary-public-storage
        env:
          # set a secret SITE_URL in the repo settings, e.g. https://app.yourdomain.com
          SITE_URL: ${{ secrets.SITE_URL }}
